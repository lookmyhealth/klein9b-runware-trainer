---
job: extension
config:
  name: "maya_flux2_klein9b_runware_1000step"
  process:
    - type: "sd_trainer"
      training_folder: "/workspace/output"
      device: "cuda:0"
      trigger_word: "zkchr7"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: "bf16"
        save_format: "diffusers"
        save_every: 200
        max_step_saves_to_keep: 5
        push_to_hub: false
      datasets:
        - folder_path: "/workspace/datasets/maya"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512]
      train:
        batch_size: 1
        steps: 1000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "sigmoid"
        optimizer: "adamw8bit"
        lr: 0.00008
        lr_scheduler: "constant"
        dtype: "bf16"
        skip_first_sample: true
        disable_sampling: true
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
        arch: "flux2_klein_9b"
        quantize: true
        quantize_te: true
      sample:
        sampler: "flowmatch"
        sample_every: 1000
        width: 512
        height: 512
        prompts:
          - "a studio portrait photo of zkchr7 person"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 4
meta:
  name: "[name]"
  version: "1.0"
